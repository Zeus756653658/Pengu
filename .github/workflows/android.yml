name: Build & Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - uses: gradle/actions/setup-gradle@v3

    - name: Build Generic Release APKs
      run: ./gradlew assembleGenericRelease

    - name: Sign app APK
      if: ${{ env.HAS_SIGNING_KEY == 'true' }}
      env:
        HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
      id: sign_app
      uses: ilharp/sign-android-release@nightly
      with:
        releaseDir: app/build/outputs/apk/generic/release
        signingKey: ${{ secrets.SIGNING_KEY }}
        keyAlias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pengu-release-apks
        path: app/build/outputs/apk/generic/release/*.apk
        if-no-files-found: error
        retention-days: 20

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Pengu ${{ github.ref_name }}
        body_path: release/changelog.md
        files: app/build/outputs/apk/generic/release/*.apk
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
